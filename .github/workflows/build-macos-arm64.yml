name: Build macOS arm64 (Bruno DMG)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-arm64:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: v22.17.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build workspace libraries
        run: |
          npm run build:graphql-docs
          npm run build:bruno-query
          npm run build:bruno-common
          npm run sandbox:bundle-libraries --workspace=packages/bruno-js
          npm run build:bruno-converters
          npm run build:bruno-requests
          npm run build:schema-types
          npm run build:bruno-filestore
          npm run build:bruno-sqlite

      - name: Build web
        run: npm run build:web

      - name: Neutralize code signing (unsigned CI build)
        run: |
          sed -i '' "s/identity: 'Anoop MD (W7LPPWA48L)'/identity: null/" packages/bruno-electron/electron-builder-config.js
          sed -i '' "/afterSign: 'notarize.js'/d" packages/bruno-electron/electron-builder-config.js

      - name: Build DMG (arm64)
        working-directory: packages/bruno-electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg --arm64 --config electron-builder-config.js --publish never

      - name: Collect DMG
        run: |
          VERSION=$(node -p "require('./packages/bruno-electron/package.json').version")
          DMG=$(find packages/bruno-electron/out -name "*.dmg" -type f | head -1)
          mkdir -p release
          cp "$DMG" "release/bruno_${VERSION}_arm64_mac_ccs.dmg"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bruno-macos-arm64-dmg
          path: release/*.dmg
          if-no-files-found: error

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          gh release create "$TAG" release/*.dmg \
            --title "Bruno $VERSION (macOS arm64)" \
            --notes "自编译 Bruno macOS arm64 DMG（未签名）。首次打开前：xattr -d com.apple.quarantine <DMG路径>" \
            --latest || gh release upload "$TAG" release/*.dmg --clobber
